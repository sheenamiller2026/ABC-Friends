<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Letter Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one calm card in the middle of the screen, the same three-part shape on every screen (top bar, card, two big buttons). */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --ink: #22302b;
  --muted: #5d6b65;
  --line: #d3ddd8;
  --accent: #2f6f62;
  --accent-ink: #ffffff;
  --soft: #dcebe5;
  --mark: #b9771a;
  --mark-soft: #f6e7cc;
  --font-letter: "Andika", "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a18; --surface: #1e2724; --ink: #e6eeea; --muted: #9eaca6; --line: #33413c;
    --accent: #7cc2b3; --accent-ink: #10201b; --soft: #24403a; --mark: #e9b45a; --mark-soft: #3d3220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a18; --surface: #1e2724; --ink: #e6eeea; --muted: #9eaca6; --line: #33413c;
  --accent: #7cc2b3; --accent-ink: #10201b; --soft: #24403a; --mark: #e9b45a; --mark-soft: #3d3220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 18px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2 { text-wrap: balance; margin: 0; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-letter); font-weight: 700; font-size: 26px; display: flex; align-items: baseline; gap: 2px; }
.brand b { color: var(--accent); }
.tabs { display: flex; gap: 6px; background: var(--soft); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-weight: 700; }
.tabs button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 18px; font-weight: 700; min-height: 52px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { font-size: 22px; min-height: 72px; padding: 14px 22px; border-radius: 18px; flex: 1; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* home */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mode { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.mode .eg { font-family: var(--font-letter); font-size: 34px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.mode strong { font-size: 20px; }
.mode span { color: var(--muted); font-size: 16px; }
.mode:hover { border-color: var(--accent); }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.picker button { font-family: var(--font-letter); font-size: 24px; font-weight: 700; aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); position: relative; }
.picker button[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--ink); }
.picker button .dot { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--mark); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 16px; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

/* play */
.progress { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 380px; text-align: center; }
.letter { font-family: var(--font-letter); font-weight: 700; font-size: clamp(120px, 30vw, 220px); line-height: 1; letter-spacing: .02em; }
.letter .lo { color: var(--accent); margin-left: .12em; }
.pic { width: min(240px, 60vw); aspect-ratio: 1; border-radius: 22px; background: var(--soft); display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.pic img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.pic .ph { width: 46%; height: 46%; color: var(--accent); opacity: .5; }
.pic.small { width: min(180px, 46vw); }
.name { font-family: var(--font-letter); font-size: clamp(36px, 8vw, 56px); font-weight: 700; line-height: 1.1; }
.name .first { color: var(--mark); background: var(--mark-soft); border-radius: 10px; padding: 0 .08em; }
.name .blank { display: inline-block; min-width: .7em; border-bottom: 5px solid var(--mark); margin-right: .04em; color: transparent; }
.from { color: var(--muted); font-size: 17px; }
.sentence { font-family: var(--font-letter); font-size: 26px; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 520px; }
/* Wide pairs like "Mm" and "Ww" must fit the same square as "Ii", so size to the column, not the screen. */
.choices { container-type: inline-size; }
.choice { font-family: var(--font-letter); font-weight: 700; font-size: clamp(36px, 15cqi, 76px); line-height: 1; aspect-ratio: 1; border-radius: 22px; border: 3px solid var(--line); background: var(--surface); min-width: 0; padding: 0; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
.choice.no { opacity: .3; }
.choice.yes { background: var(--soft); border-color: var(--accent); }
.feedback { min-height: 30px; font-size: 20px; font-weight: 700; color: var(--accent); }
.hint { font-size: 14px; color: var(--muted); text-align: center; }
.mic { width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 0 0 0 var(--soft); transition: box-shadow .4s ease; }
.mic svg { width: 56px; height: 56px; }
.mic.on { box-shadow: 0 0 0 16px var(--soft); }
.mic:disabled { opacity: .45; }
.heard { font-size: 20px; min-height: 30px; color: var(--muted); }
.dictate { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface); font-size: 28px; font-family: var(--font-letter); text-align: center; width: min(260px, 100%); }
.done-letters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.done-letters span { font-family: var(--font-letter); font-weight: 700; font-size: 26px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: var(--soft); }
.done-letters span.again { background: var(--mark-soft); color: var(--mark); }

/* edit */
.grid26 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .pic { width: 100%; border-radius: 12px; }
.tile .tl { font-family: var(--font-letter); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.tile .tl b { color: var(--mark); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 720px) { .editor { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type=text] { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); font-size: 20px; width: 100%; }
.canvas-box { border: 2px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; touch-action: none; aspect-ratio: 1; max-width: 100%; }
.canvas-box canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.size { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.size[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.size i { display: block; border-radius: 50%; background: var(--ink); }
.small-btn { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 16px; min-height: 44px; }
.small-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.note { font-size: 15px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 10px 14px; }
.saved { color: var(--accent); font-weight: 700; min-height: 26px; }
.file-label { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap" id="app">
  <div class="bar">
    <div class="brand"><b>A</b>a Letter Friends</div>
    <nav class="tabs" aria-label="Sections">
      <button id="tab-play" aria-pressed="true">Play</button>
      <button id="tab-edit" aria-pressed="false">Letters &amp; pictures</button>
    </nav>
  </div>
  <main id="view"></main>
</div>

// ---------- storage ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
let overrides = {};            // letter -> {name, from, assetId?, img?}
let db = null, assets = null;  // shared storage when the viewer provides it
let storeMode = "loading";     // "cloud" | "device"
let progress = LS.get("lf-progress", {});   // letter -> streak of correct answers
let prefs = Object.assign({ set: ABC.slice(0, 7), lower: true, voice: true }, LS.get("lf-prefs", {}));

function savePrefs() { LS.set("lf-prefs", prefs); }
function info(L) {
  const o = overrides[L] || {};
  const d = DEFAULTS[L];
  const name = (o.name || d[0]).trim();
  return { L, name, from: o.from != null ? o.from : d[1], sound: o.sound ? o.sound.trim() : "", img: o.assetId ? "/_blob/" + o.assetId : (o.img || (o.noPic ? null : BUILTIN_IMG[L] || null)), custom: !!o.name };
}

async function connect() {
  const c = window.claude;
  if (c && c.use) {
    try { db = await c.use("db"); } catch { db = null; }
    try { assets = await c.use("assets"); } catch { assets = null; }
  }
  if (db) {
    storeMode = "cloud";
    db.collection("letters").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      overrides = next;
      rerenderIfQuiet();
    }, () => { storeMode = "device"; overrides = LS.get("lf-letters", {}); rerenderIfQuiet(); });
  } else {
    storeMode = "device";
    overrides = LS.get("lf-letters", {});
    rerenderIfQuiet();
  }
}

async function saveLetter(L, data, blob) {
  if (storeMode === "cloud") {
    const prev = overrides[L] || {};
    let assetId = data.removePic ? null : (prev.assetId || null);
    if (blob && assets) {
      const up = await assets.upload(blob, { type: "image/png" });
      if (prev.assetId) { try { await assets.delete(prev.assetId); } catch {} }
      assetId = up.id;
    } else if (data.removePic && prev.assetId) {
      try { await assets.delete(prev.assetId); } catch {}
    }
    if (blob && !assets) throw { message: "Pictures can only be saved by the page owner." };
    const doc = { name: data.name, from: data.from, updatedAt: Date.now() };
    if (data.sound) doc.sound = data.sound;
    if (assetId) doc.assetId = assetId;
    await db.doc("letters/" + L).set(doc);
  } else {
    const all = LS.get("lf-letters", {});
    const prev = all[L] || {};
    const rec = { name: data.name, from: data.from };
    if (data.sound) rec.sound = data.sound;
    if (blob) rec.img = await blobToSmallDataUrl(blob);
    else if (!data.removePic && prev.img) rec.img = prev.img;
    if (data.removePic) rec.noPic = true;
    all[L] = rec;
    if (!LS.set("lf-letters", all)) throw { message: "this browser would not keep it (it may be full or in private mode)." };
    overrides = all;
  }
}
async function resetLetter(L) {
  if (storeMode === "cloud") {
    const prev = overrides[L] || {};
    if (prev.assetId && assets) { try { await assets.delete(prev.assetId); } catch {} }
    await db.doc("letters/" + L).delete();
  } else {
    const all = LS.get("lf-letters", {}); delete all[L]; LS.set("lf-letters", all); overrides = all;
  }
}
function blobToSmallDataUrl(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 400;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,400,400); x.drawImage(img,0,0,400,400);
      res(c.toDataURL("image/jpeg", .82)); };
    img.src = URL.createObjectURL(blob);
  });
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const letterHtml = L => `<span>${L}</span>${prefs.lower ? `<span class="lo">${L.toLowerCase()}</span>` : ""}`;

  if (mode === "blank") return `<span class="blank">${first}</span>${rest}`;

// done (optional) runs once when speech ends, or after a fallback wait if the device never reports it.
function say(text, force, done) {
  let fired = false; const fin = () => { if (!fired) { fired = true; done && done(); } };
  if (!prefs.voice && !force) return fin();
  try {
    const s = window.speechSynthesis; if (!s) return fin(); s.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = .85; u.onend = fin; u.onerror = fin; s.speak(u);
    if (done) setTimeout(fin, 900 + text.length * 120);
  } catch { fin(); }
}

});

function playAudio(src, then) {
  try {
    audioEl.onended = () => { audioEl.onended = null; then && then(); };
    audioEl.muted = false; audioEl.src = src; audioEl.currentTime = 0;
    const pr = audioEl.play(); if (pr) pr.catch(() => { then && then(); });
  } catch { then && then(); }
}
function playSound(L, then) {
  const i = info(L);
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {}
  if (i.sound) { say(i.sound, true); if (then) setTimeout(then, 900); return; }
  playAudio(CLIPS[L], then);
}
function playName(L, name, done) {
  name = name || info(L).name;
  const c = NAME_CLIPS[L];
  if (c && c.name.toLowerCase() === name.trim().toLowerCase()) playAudio(c.src, done);
  else say(name, true, done);
}
// Phonics routine: the sound, then the friend's name. Letter names are never spoken.
const saySound = (L, force, done) => { if (!prefs.voice && !force) return done && done(); playSound(L, () => playName(L, null, done)); };
let screen = "home", busy = false;
function rerenderIfQuiet() { if (screen === "home") renderHome(); else if (screen === "edit-grid") renderEditGrid(); }

document.getElementById("tab-play").onclick = () => renderHome();
document.getElementById("tab-edit").onclick = () => renderEditGrid();
function setTab(which) {
  document.getElementById("tab-play").setAttribute("aria-pressed", which === "play");
  document.getElementById("tab-edit").setAttribute("aria-pressed", which === "edit");
}

// ---------- home ----------
const PRESETS = [["A–G", 0, 7], ["H–N", 7, 14], ["O–U", 14, 21], ["V–Z", 21, 26], ["All 26", 0, 26]];
function renderHome() {
  screen = "home"; setTab("play"); stopKeys();
  const set = new Set(prefs.set);
  $view.replaceChildren(h(`
    <div class="wrap" style="padding:0">
      <section class="panel">
        <div class="label">Choose a game</div>
        <div class="modes">
          <button class="mode" data-mode="say"><span class="eg">E e</span><strong>Say the sound</strong><span>See a letter and its friend, then say the letter’s sound. Tap to hear the friend’s name if you need help.</span></button>
          <button class="mode" data-mode="listen"><span class="eg"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg> → b</span><strong>Hear the sound</strong><span>Listen to a sound. Pick the letter that makes it.</span></button>
          <button class="mode" data-mode="friend"><span class="eg">_lsa</span><strong>Whose letter?</strong><span>See a friend. Pick the letter their name starts with.</span></button>
          <button class="mode" data-mode="speak"><span class="eg">E <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><strong>Say it out loud</strong><span>See a letter, tap the microphone and say its sound. The game listens and checks.</span></button>
          <button class="mode" data-mode="match"><span class="eg">E → e</span><strong>Big and little</strong><span>See a big letter. Find the little one that matches.</span></button>
        </div>
      </section>
      <section class="panel">
        <div class="row" style="justify-content:space-between;align-items:center">
          <div class="label">Letters to practice (${set.size})</div>
          <div class="chips">${PRESETS.map((p, i) => `<button class="chip" data-preset="${i}">${p[0]}</button>`).join("")}</div>
        </div>
        <div class="picker">${ABC.map(L => `<button data-l="${L}" aria-pressed="${set.has(L)}" aria-label="${L}${(progress[L]||0) >= 3 ? ', known' : ''}">${L}${(progress[L]||0) >= 3 ? '<span class="dot"></span>' : ''}</button>`).join("")}</div>
        <div class="row" style="justify-content:space-between;align-items:center">
          <div class="row" style="gap:20px">
            <label class="toggle"><input type="checkbox" id="opt-lower" ${prefs.lower ? "checked" : ""}> Show little letters too</label>
            <label class="toggle"><input type="checkbox" id="opt-voice" ${prefs.voice ? "checked" : ""}> Read sounds aloud</label>
          </div>
          <span class="hint">A dot means the letter was right 3 times in a row.</span>
        </div>
      </section>
    </div>`));
  $view.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { if (!prefs.set.length) return; startGame(b.dataset.mode); });
  $view.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    const L = b.dataset.l; const s = new Set(prefs.set); s.has(L) ? s.delete(L) : s.add(L);
    prefs.set = ABC.filter(x => s.has(x)); savePrefs(); renderHome();
  });
  $view.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { const p = PRESETS[b.dataset.preset]; prefs.set = ABC.slice(p[1], p[2]); savePrefs(); renderHome(); });
  document.getElementById("opt-lower").onchange = e => { prefs.lower = e.target.checked; savePrefs(); };
  document.getElementById("opt-voice").onchange = e => { prefs.voice = e.target.checked; savePrefs(); };
}

// ---------- games ----------
// A short deck: each chosen letter once (up to 10), shuffled. A missed letter comes back three cards later.
let game = null, keyHandler = null;
function stopKeys() { if (keyHandler) { document.removeEventListener("keydown", keyHandler); keyHandler = null; } }
function startGame(mode) {
  const deck = shuffle(prefs.set).slice(0, 10);
  game = { mode, deck, total: deck.length, done: 0, results: {}, missedThis: false };
  screen = "game"; stopKeys(); nextCard();
}
function mark(L, right) {
  if (right) { progress[L] = (progress[L] || 0) + 1; }
  else { progress[L] = 0; }
  LS.set("lf-progress", progress);
}
function finishCard(L, right, requeue = !right) {
  if (!(L in game.results)) game.results[L] = right;
  mark(L, right);
  game.deck.shift();
  if (right) game.done++;
  else if (requeue) game.deck.splice(Math.min(3, game.deck.length), 0, L);
  else game.done++;
  nextCard();
}
function shell(inner) {
  const pct = Math.round(game.done / game.total * 100);
  $view.replaceChildren(h(`
    <div class="wrap" style="padding:0">
      <div class="progress">
        <button class="small-btn" id="quit">Stop</button>
        <div class="track" aria-hidden="true"><div class="fill" style="width:${pct}%"></div></div>
        <span class="muted" style="font-variant-numeric:tabular-nums">${game.done} / ${game.total}</span>
      </div>
      ${inner}
    </div>`));
  document.getElementById("quit").onclick = () => renderHome();
}
function nextCard() {
  stopKeys();
  if (!game.deck.length) return renderDone();
  const L = game.deck[0];
  ({ say: cardSay, listen: cardListen, friend: cardFriend, match: cardMatch, speak: cardSpeak })[game.mode](L);
}

// The friend's picture shows with the letter. Help says only the friend's name, never the letter.
function cardSay(L) {
  const i = info(L);
  let helped = false;
  shell(`
    <section class="card">
      <div class="letter">${letterHtml(L)}</div>
      ${picHtml(i, "small")}
      <div class="muted">What sound does it make?</div>
    </section>
    <div class="row">
      <button class="btn big" id="help">Hear the name</button>
      <button class="btn big" id="again">Not yet</button>
      <button class="btn big primary" id="knew">Said it right</button>
    </div>
    <p class="hint">Keys: Space says the friend's name · Enter means "Said it right"</p>`);
  const help = () => { helped = true; playName(L); };
  document.getElementById("help").onclick = help;
  document.getElementById("knew").onclick = () => finishCard(L, !helped, false);
  document.getElementById("again").onclick = () => finishCard(L, false);
  keyHandler = e => {
    if (e.key === " ") { e.preventDefault(); help(); }
    else if (e.key === "Enter") { e.preventDefault(); finishCard(L, !helped, false); }
  };
  document.addEventListener("keydown", keyHandler);
}

const SAME_SOUND = [["C", "K", "Q"]];
function optionsFor(L) {
  const twins = (SAME_SOUND.find(g => g.includes(L)) || [L]);
  const pool = shuffle(ABC.filter(x => !twins.includes(x) && !(SAME_SOUND.find(g => g.includes(x)) || []).some(t => t !== x && twins.includes(t))));
  return shuffle([L, pool[0], pool[1]]);
}
function choiceCard(L, prompt, show, opts, onRight) {
  let firstTry = true, locked = false;
  shell(`
    <section class="card">
      ${prompt}
      <div class="choices">${opts.map(o => `<button class="choice" data-o="${o}">${show(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </section>
    <p class="hint">Keys: 1, 2 or 3 picks a letter</p>`);
  const btns = [...$view.querySelectorAll(".choice")];
  const pick = b => {
    if (locked || b.classList.contains("no")) return;
    if (b.dataset.o === L) {
      locked = true; b.classList.add("yes");
      btns.forEach(x => { if (x !== b) x.classList.add("no"); });
      document.getElementById("fb").textContent = "Yes!";
      let moved = false;
      const advance = () => { if (moved) return; moved = true; setTimeout(() => finishCard(L, firstTry), 900); };
      if (onRight) onRight(advance); else advance();
      setTimeout(advance, 8000);
    } else {
      firstTry = false; b.classList.add("no");
      document.getElementById("fb").textContent = "Try another one.";
    }
  };
  btns.forEach(b => b.onclick = () => pick(b));
  keyHandler = e => { const n = +e.key; if (n >= 1 && n <= 3) pick(btns[n - 1]); };
  document.addEventListener("keydown", keyHandler);
}
function cardFriend(L) {
  const i = info(L);
  choiceCard(L, `
      ${picHtml(i, "small")}
      <div class="name" id="nm">${nameHtml(i, "blank")}</div>
      ${i.from ? `<div class="from">from ${esc(i.from)}</div>` : ""}`,
    o => `${o}${prefs.lower ? `<span style="color:var(--accent)">${o.toLowerCase()}</span>` : ""}`,
    optionsFor(L),
    advance => { document.getElementById("nm").innerHTML = nameHtml(i); saySound(L, false, advance); });
}
function cardListen(L) {
  const i = info(L);
  choiceCard(L, `
      <button class="mic" id="play" aria-label="Play the sound again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <div class="muted">Which letter makes this sound?</div>
      <div id="reveal" hidden style="display:flex;flex-direction:column;align-items:center;gap:6px">${picHtml(i, "small")}<div class="name">${nameHtml(i)}</div></div>`,
    o => `${o}${prefs.lower ? `<span style="color:var(--accent)">${o.toLowerCase()}</span>` : ""}`,
    optionsFor(L),
    advance => { document.getElementById("reveal").hidden = false; saySound(L, true, advance); });
  const play = () => playSound(L);
  document.getElementById("play").onclick = play;
  play();
}

// ---------- listening game ----------
// A speech recognizer has no way to write a bare sound, so it guesses a word ("buh" often comes back
// as "but" or "bug"). Count it as right when a word it heard starts with the letter (or its sound twin).
const STARTS = { C: ["c", "k"], K: ["k", "c"], Q: ["q", "kw"], X: ["x", "ex", "ks", "ax"] };
function soundMatches(L, text) {
  const words = text.toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).filter(Boolean);
  const starts = STARTS[L] || [L.toLowerCase()];
  const mine = info(L).sound.toLowerCase().replace(/[^a-z]/g, "") || "-";
  return words.some(w => w === mine || starts.some(st => w.startsWith(st)));
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked = !SR;   // once the browser refuses the microphone, use keyboard dictation instead
const micSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function cardSpeak(L) {
  const i = info(L);
  let tries = 0, firstTry = true, locked = false, rec = null;
  shell(`
    <section class="card">
      <div class="letter">${letterHtml(L)}</div>
      ${picHtml(i, "small")}
      <div id="listen" style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <button class="mic" id="mic" aria-label="Tap and say the sound">${micSvg}</button>
        <div class="muted" id="micLabel">Tap and say the sound</div>
      </div>
      <div id="typed" hidden style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <input class="dictate" id="dict" type="text" autocomplete="off" autocapitalize="characters" aria-label="Say the sound with keyboard dictation">
        <div class="muted" style="font-size:15px;max-width:340px">Tap the box, then tap the microphone on the keyboard and say the sound.</div>
      </div>
      <div class="heard" id="heard" aria-live="polite"></div>
      <div id="helper" hidden class="name">${nameHtml(i)}</div>
    </section>
    <div class="row">
      <button class="btn big" id="skip">Skip for now</button>
      <button class="btn big" id="help">Hear the name</button>
      <button class="btn big" id="heardRight">Said it right</button>
    </div>
    <p class="hint">The grown-up button counts it as right if the game misheard.</p>`);
  const heard = document.getElementById("heard"), mic = document.getElementById("mic"), micLabel = document.getElementById("micLabel");
  const showTyped = () => { document.getElementById("listen").hidden = true; document.getElementById("typed").hidden = false; };
  if (micBlocked) showTyped();
  const right = (how) => {
    if (locked) return; locked = true; try { rec && rec.abort(); } catch {}
    heard.innerHTML = `<strong style="color:var(--accent)">Yes!</strong>`;
    document.getElementById("helper").hidden = false;
    let moved = false;
    const advance = () => { if (moved) return; moved = true; setTimeout(() => finishCard(L, firstTry && how !== "adult"), 900); };
    saySound(L, false, advance);
    setTimeout(advance, 8000);
  };
  const judge = (alts) => {
    if (alts.some(a => soundMatches(L, a))) return right();
    firstTry = false; tries++;
    const shown = alts[0] ? `I heard "${esc(alts[0].trim())}".` : "I didn't hear a sound.";
    heard.innerHTML = `${shown} Try again.`;
    if (tries >= 2) heard.innerHTML += " Tap Hear the name for help.";
  };
  mic.onclick = () => {
    if (locked || rec) return;
    try {
      rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
    } catch { micBlocked = true; showTyped(); return; }
    let got = false;
    rec.onresult = e => { got = true; const r = e.results[0]; judge([...r].map(a => a.transcript)); };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
        micBlocked = true; showTyped(); heard.textContent = "The microphone is not available here, so use the keyboard microphone instead.";
      } else if (e.error === "no-speech") { heard.textContent = "I didn't hear anything. Tap and try again."; }
    };
    rec.onend = () => { rec = null; mic.classList.remove("on"); micLabel.textContent = "Tap and say the sound"; };
    try { rec.start(); mic.classList.add("on"); micLabel.textContent = "Listening…"; heard.textContent = ""; }
    catch { rec = null; micBlocked = true; showTyped(); }
  };
  const dict = document.getElementById("dict");
  let t = null;
  dict.oninput = () => { clearTimeout(t); t = setTimeout(() => {
    const v = dict.value.trim(); if (!v) return;
    judge([v]); dict.value = "";
  }, 700); };
  document.getElementById("skip").onclick = () => { if (!locked) { locked = true; try { rec && rec.abort(); } catch {} finishCard(L, false); } };
  document.getElementById("heardRight").onclick = () => right("adult");
  document.getElementById("help").onclick = () => { firstTry = false; playName(L); };
  keyHandler = e => { if (e.key === " " && document.activeElement !== dict) { e.preventDefault(); mic.click(); } };
  document.addEventListener("keydown", keyHandler);
}

function cardMatch(L) {
  const i = info(L);
  choiceCard(L, `<div class="letter" style="font-size:clamp(110px,26vw,180px)">${L}</div><div class="muted">Find the little letter</div>`,
    o => o.toLowerCase(), optionsFor(L),
    advance => { if (prefs.voice) playSound(L, advance); else advance(); });
}

function renderDone() {
  const letters = Object.keys(game.results);
  const again = letters.filter(L => !game.results[L]);
  stopKeys(); screen = "done";
  $view.replaceChildren(h(`
    <div class="wrap" style="padding:0">
      <section class="card">
        <h2 style="font-family:var(--font-letter);font-size:44px">All done!</h2>
        <p class="muted" style="margin:0">${letters.length - again.length} of ${letters.length} letters right the first time.</p>
        <div class="done-letters">${letters.map(L => `<span class="${game.results[L] ? "" : "again"}">${L}</span>`).join("")}</div>
        ${again.length ? `<p class="muted" style="margin:0">Letters in gold are good ones to practice next.</p>` : ""}
      </section>
      <div class="row">
        <button class="btn big" id="home">Choose a game</button>
        <button class="btn big primary" id="replay">Play again</button>
      </div>
    </div>`));
  document.getElementById("home").onclick = () => renderHome();
  document.getElementById("replay").onclick = () => startGame(game.mode);
  keyHandler = e => { if (e.key === "Enter") startGame(game.mode); };
  document.addEventListener("keydown", keyHandler);
}

// ---------- edit ----------
function storeNote() {
  if (storeMode === "cloud") return `<div class="note">Changes are saved online, so they show up on any device where you open this page.</div>`;
  if (storeMode === "device") return `<div class="note">Changes you make here are saved in this browser, on this device only.</div>`;
  return "";
}
function renderEditGrid() {
  screen = "edit-grid"; setTab("edit"); stopKeys();
  $view.replaceChildren(h(`
    <div class="wrap" style="padding:0">
      <div class="panel">
        <h2 style="font-family:var(--font-letter);font-size:28px">Letters &amp; pictures</h2>
        <p class="muted" style="margin:0">Tap a letter to change its friend, draw a picture, or add one from your files.</p>
        <div class="row" style="align-items:center">
          <label class="btn primary file-label">Add many pictures<input type="file" id="bulk" accept="image/*" multiple></label>
          <span class="muted" style="font-size:15px;flex:1;min-width:220px">Name each file after the friend or the letter, like <b>Elsa.png</b> or <b>E.jpg</b>. Each picture goes to its letter.</span>
        </div>
        <div class="note" id="bulkOut" hidden></div>
        ${storeNote()}
      </div>
      <div class="grid26">${ABC.map(L => { const i = info(L); return `
        <button class="tile" data-l="${L}">
          ${picHtml(i)}
          <span class="tl"><b>${L}</b> ${esc(i.name)}</span>
          <span class="muted" style="font-size:14px">${esc(i.from || "")}</span>
        </button>`; }).join("")}</div>
    </div>`));
  $view.querySelectorAll(".tile").forEach(b => b.onclick = () => renderEditor(b.dataset.l));
  document.getElementById("bulk").onchange = e => bulkUpload([...e.target.files]);
}

// Match a file to a letter: the friend's name first ("Elsa.png"), then a lone letter ("E.jpg"), then the file's first letter.
function letterForFile(fname) {
  const base = fname.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z]/g, "");
  if (!base) return null;
  for (const L of ABC) { const n = info(L).name.toLowerCase().replace(/[^a-z]/g, ""); if (n && (base === n || base.startsWith(n) || base.includes(n))) return L; }
  return base[0].toUpperCase();
}
function fileToSquarePng(file) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 800; const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, 800, 800);
      const k = Math.min(800 / im.width, 800 / im.height), w = im.width * k, hh = im.height * k;
      x.drawImage(im, (800 - w) / 2, (800 - hh) / 2, w, hh); c.toBlob(b => b ? res(b) : rej(), "image/png"); };
    im.onerror = () => rej(); im.src = URL.createObjectURL(file);
  });
}
async function bulkUpload(files) {
  if (!files.length) return;
  const lines = [];
  // The grid can redraw while saving, so look the message box up each time.
  const show = () => { const o = document.getElementById("bulkOut"); if (o) { o.hidden = false; o.innerHTML = lines.join("<br>"); } };
  for (const f of files) {
    const L = letterForFile(f.name);
    if (!L) { lines.push(`${esc(f.name)}: couldn't tell which letter. Add it from that letter's page.`); show(); continue; }
    const i = info(L);
    lines.push(`${esc(f.name)} → ${L} (${esc(i.name)})…`); show();
    try {
      await saveLetter(L, { name: i.name, from: i.from || "", sound: (overrides[L] || {}).sound }, await fileToSquarePng(f));
      lines[lines.length - 1] = `${esc(f.name)} → ${L} (${esc(i.name)}). Saved.`;
    } catch (err) { lines[lines.length - 1] = `${esc(f.name)} → ${L}: not saved. ${esc((err && err.message) || "")}`; }
    show();
  }
  if (screen === "edit-grid") { renderEditGrid(); show(); }
}

const COLORS = ["#1f2a26", "#d6453d", "#ef8a2f", "#f2c531", "#3a9a4f", "#2f78c4", "#7d4fc2", "#e57aa8", "#8a5a35", "#ffffff"];
function renderEditor(L) {
  screen = "edit-one"; setTab("edit"); stopKeys();
  const i = info(L);
  let changedPic = false, removePic = false;
  $view.replaceChildren(h(`
    <div class="wrap" style="padding:0">
      <div class="row" style="align-items:center;justify-content:space-between">
        <button class="small-btn" id="back">All letters</button>
        <div class="row" style="gap:8px">
          <button class="small-btn" id="prev" aria-label="Previous letter">${ABC[(ABC.indexOf(L) + 25) % 26]}</button>
          <button class="small-btn" id="next" aria-label="Next letter">${ABC[(ABC.indexOf(L) + 1) % 26]}</button>
        </div>
      </div>
      <div class="editor">
        <div class="panel">
          <div class="letter" style="font-size:120px;text-align:center">${L}<span class="lo">${L.toLowerCase()}</span></div>
          <div class="field"><label class="label" for="f-name">Friend's first name</label><input type="text" id="f-name" value="${esc(i.name)}" autocomplete="off"></div>
          <div class="field"><label class="label" for="f-from">Where they're from (optional)</label><input type="text" id="f-from" value="${esc(i.from || "")}" autocomplete="off"></div>
          <div class="field"><label class="label" for="f-sound">Letter sound</label>
            <div class="row" style="gap:8px;flex-wrap:nowrap"><input type="text" id="f-sound" value="${esc(i.sound)}" placeholder="Built-in sound clip" autocomplete="off" style="flex:1;min-width:0"><button class="small-btn" id="play-sound">Play</button></div>
            <span class="muted" style="font-size:14px">Leave this empty to use the built-in sound clip. Typing a spelling makes the device voice read it instead.</span></div>
          <div class="note" id="warn" hidden></div>
          <div class="row">
            <button class="btn primary" id="save" style="flex:1">Save ${L}</button>
            <button class="btn" id="reset">Use the starting friend</button>
          </div>
          <div class="saved" id="saved" aria-live="polite"></div>
          ${storeNote()}
        </div>
        <div class="panel">
          <div class="label">Picture</div>
          <div class="canvas-box"><canvas id="cv" width="800" height="800" aria-label="Drawing area for ${L}"></canvas></div>
          <div class="tools" id="colors">${COLORS.map((c, n) => `<button class="swatch" style="background:${c}" data-c="${c}" aria-label="Color ${n + 1}" aria-pressed="${n === 0}"></button>`).join("")}</div>
          <div class="tools">
            ${[8, 18, 40].map((s, n) => `<button class="size" data-s="${s}" aria-label="Brush size ${n + 1}" aria-pressed="${n === 1}"><i style="width:${6 + n * 7}px;height:${6 + n * 7}px"></i></button>`).join("")}
            <button class="small-btn" id="eraser" aria-pressed="false">Eraser</button>
            <button class="small-btn" id="undo">Undo</button>
            <button class="small-btn" id="clear">Clear</button>
          </div>
          <div class="tools">
            <label class="small-btn file-label">Add a picture from files<input type="file" id="file" accept="image/*"></label>
            <button class="small-btn" id="nopic">Remove picture</button>
          </div>
          <p class="hint" style="text-align:left;margin:0">Draw with a finger, stylus or mouse. You can add a picture and draw on top of it.</p>
        </div>
      </div>
    </div>`));

  // canvas
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let color = COLORS[0], size = 18, erasing = false, drawing = false, last = null;
  const history = [];
  const blank = () => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 800, 800); };
  const snapshot = () => { history.push(ctx.getImageData(0, 0, 800, 800)); if (history.length > 25) history.shift(); };
  blank();
  const drawImg = (src, after) => { const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => { blank(); const s = Math.min(800 / im.width, 800 / im.height); const w = im.width * s, hh = im.height * s;
      ctx.drawImage(im, (800 - w) / 2, (800 - hh) / 2, w, hh); after && after(); };
    im.src = src; };
  if (i.img) drawImg(i.img);
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * 800 / r.width, y: (e.clientY - r.top) * 800 / r.height }; };
  const stroke = (a, b) => { ctx.strokeStyle = erasing ? "#fff" : color; ctx.lineWidth = size; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); snapshot(); drawing = true; last = pos(e); stroke(last, { x: last.x + .1, y: last.y + .1 }); changedPic = true; removePic = false; });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); stroke(last, p); last = p; });
  const end = () => { drawing = false; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);

  document.querySelectorAll("#colors .swatch").forEach(b => b.onclick = () => {
    color = b.dataset.c; erasing = false; document.getElementById("eraser").setAttribute("aria-pressed", "false");
    document.querySelectorAll("#colors .swatch").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  document.querySelectorAll(".size").forEach(b => b.onclick = () => { size = +b.dataset.s; document.querySelectorAll(".size").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  document.getElementById("eraser").onclick = e => { erasing = !erasing; e.currentTarget.setAttribute("aria-pressed", erasing); };
  document.getElementById("undo").onclick = () => { const s = history.pop(); if (s) { ctx.putImageData(s, 0, 0); changedPic = true; } };
  document.getElementById("clear").onclick = () => { snapshot(); blank(); changedPic = true; };
  document.getElementById("nopic").onclick = () => { snapshot(); blank(); changedPic = false; removePic = true; };
  document.getElementById("file").onchange = e => { const f = e.target.files[0]; if (!f) return; snapshot();
    const url = URL.createObjectURL(f); drawImg(url, () => { changedPic = true; removePic = false; }); e.target.value = ""; };

  // fields
  const warn = document.getElementById("warn");
  const nameInput = document.getElementById("f-name");
  const check = () => { const n = nameInput.value.trim();
    if (n && n[0].toUpperCase() !== L) { warn.hidden = false; warn.textContent = `"${n}" starts with ${n[0].toUpperCase()}, not ${L}. You can still save it.`; }
    else warn.hidden = true; };
  nameInput.oninput = check; check();

  document.getElementById("play-sound").onclick = () => {
    const v = document.getElementById("f-sound").value.trim(), nm = nameInput.value.trim() || i.name;
    if (v) say(`${v}, ${nm}`, true); else playSound(L, () => playName(L, nm));
  };
  const go = (to) => () => to();
  document.getElementById("back").onclick = go(renderEditGrid);
  document.getElementById("prev").onclick = go(() => renderEditor(ABC[(ABC.indexOf(L) + 25) % 26]));
  document.getElementById("next").onclick = go(() => renderEditor(ABC[(ABC.indexOf(L) + 1) % 26]));
  const savedEl = document.getElementById("saved");
  document.getElementById("save").onclick = async e => {
    const name = nameInput.value.trim() || DEFAULTS[L][0];
    const from = document.getElementById("f-from").value.trim();
    const soundVal = document.getElementById("f-sound").value.trim();
    const sound = soundVal || undefined;
    const btn = e.currentTarget; btn.disabled = true; savedEl.textContent = "Saving…";
    try {
      const blob = changedPic ? await new Promise(r => cv.toBlob(r, "image/png")) : null;
      await saveLetter(L, { name, from, sound, removePic }, blob);
      changedPic = false; removePic = false;
      savedEl.textContent = `Saved. ${L} is for ${name}.`;
    } catch (err) {
      savedEl.textContent = "Not saved: " + ((err && err.message) || "something went wrong. Try again.");
    }
    btn.disabled = false;
  };
  document.getElementById("reset").onclick = async () => {
    savedEl.textContent = "Resetting…";
    try { await resetLetter(L); renderEditor(L); document.getElementById("saved").textContent = `Back to ${DEFAULTS[L][0]}.`; }
    catch (err) { savedEl.textContent = "Not reset: " + ((err && err.message) || "try again."); }
  };
}

renderHome();
connect();
})();
